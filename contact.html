<body class="page-contact">
    <header>
        <div class="container">
            <a href="index.html" class="logo">Arik Singh</a>


            <button id="theme-toggle" aria-label="Toggle Light/Dark Mode">
                <span class="icon-sun">☀️</span>
                <span class="icon-moon">🌙</span>
            </button>
            <div class="hamburger" aria-label="Toggle navigation" role="button" tabindex="0">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Work</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container contact-section">
        <div class="contact-shell">
            <section class="contact-intro-card">
                <img src="assets/images/cropped/profile_cropped.webp" alt="Arik Singh" class="profile-photo">
                <div class="contact-heading-block">
                    <p class="section-kicker">Contact</p>
                    <h1>Get in Touch</h1>
                </div>
                <div class="contact-details">
                    <a href="mailto:ariksingh@gmail.com" class="contact-link">ariksingh@gmail.com</a>
                    <a href="tel:+13107104085" class="contact-link">310-710-4085</a>
                    <a href="https://www.linkedin.com/in/ariksingh/" target="_blank" rel="noopener noreferrer"
                        class="contact-link linkedin">linkedin.com/in/ariksingh</a>
                </div>
            </section>

            <form class="contact-form" action="https://formspree.io/f/xlgpdbzw" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your Name" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your.email@example.com"
                        autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="7" required
                        placeholder="How can I help you?"></textarea>
                </div>
                <button type="submit" class="submit-btn" aria-label="Send Message">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">

        </div>
    </footer>

    <script src="assets/js/main.js?v=6" defer></script>
